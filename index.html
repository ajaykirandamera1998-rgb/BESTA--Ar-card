<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Besta · Boyapati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f2e2;--ink-rgb:80,54,47;--ink:rgb(var(--ink-rgb));--boya:#edd45a;--sans:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:var(--sans);color:var(--ink);-webkit-tap-highlight-color:transparent}

/* ---------- Layout: top 70% camera + 3D model, bottom 30% information ---------- */
#ar-root{position:fixed;left:0;right:0;top:0;height:70%;height:70dvh;overflow:hidden;z-index:1;background:#241814}
#ar-root a-scene{position:absolute;inset:0;width:100%;height:100%}
.a-enter-vr,.a-enter-ar,.a-orientation-modal{display:none!important}

#hud{position:fixed;left:0;right:0;top:0;height:70%;height:70dvh;z-index:50;pointer-events:none}
#hud>*{pointer-events:auto}
.hint{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 32px);display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:rgba(36,24,20,.74);color:#fdf8ea;font-size:13px;letter-spacing:.04em;text-align:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .4s ease;opacity:0}
#hud.show .hint{opacity:1;transition-delay:.9s}
#hud.found .hint{opacity:0;transition-delay:0s;pointer-events:none}
.hint i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--boya);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{transform:scale(.6);opacity:.55}}

#panel{position:fixed;left:0;right:0;bottom:0;height:30%;height:30dvh;z-index:50;background:var(--bg);border-top:1px solid rgba(var(--ink-rgb),.14);
 padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
 overflow-y:auto;overflow-x:hidden;opacity:0;transform:translateY(14px);transition:opacity .7s ease .3s,transform .8s cubic-bezier(.2,.8,.2,1) .3s}
#panel.show{opacity:1;transform:none}
.inner{width:min(100%,640px);margin:0 auto;min-height:100%;display:grid;gap:8px;align-content:center}
.brands{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.brand{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:8px 8px 9px;border:1px solid rgba(var(--ink-rgb),.16);border-radius:14px;background:#fffaf0;color:var(--ink);text-decoration:none;transition:transform .15s ease,box-shadow .2s ease}
.brand:active{transform:scale(.98)}
.brand:hover{box-shadow:0 6px 18px rgba(var(--ink-rgb),.16)}
.brand img{display:block;height:clamp(30px,7.2dvh,64px);max-width:100%;object-fit:contain}
.ig{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.boya .ig{background:var(--boya);color:#2b2510}
.ig svg{width:14px;height:14px;flex:none}
.brand:focus-visible,.map:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.addr{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:9px 12px;border-radius:14px;background:rgba(var(--ink-rgb),.07)}
.addr svg{width:18px;height:18px;margin-top:1px;color:var(--ink)}
.addr address{font-style:normal;font-size:12.5px;line-height:1.4;font-weight:500}
.map{white-space:nowrap;font-weight:600;letter-spacing:.04em;color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--ink)}
@media (min-width:760px){
  .inner{width:min(100%,980px);grid-template-columns:1fr 1fr;gap:12px}
  .addr{align-self:stretch;align-items:center;padding:12px 16px}
  .addr address{font-size:14px}
}

/* ---------- Intro (logo reveal) ---------- */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 45%,#fbf7ea 0%,var(--bg) 55%,#efe4c9 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.7,0,.2,1)}
#intro.out{opacity:0;transform:scale(1.04);pointer-events:none}
.stage{position:relative;width:min(86vw,560px,calc(70vh*1.241));aspect-ratio:360/290}
.stage img{position:absolute;display:block;opacity:0;user-select:none;-webkit-user-drag:none}
.emb{transform-origin:50% 50%}
.play .emb{-webkit-mask-image:conic-gradient(from 0deg at 50% 50%,#000 var(--a),transparent calc(var(--a) + .4deg));mask-image:conic-gradient(from 0deg at 50% 50%,#000 var(--a),transparent calc(var(--a) + .4deg));
 animation:sweep 2.2s cubic-bezier(.6,0,.25,1) .4s forwards,emb 2.6s cubic-bezier(.2,.7,.2,1) .4s forwards}
.play .dot{animation:pop .9s cubic-bezier(.3,1.5,.5,1) calc(1.7s + var(--i)*.18s) forwards}
.play .L{animation:rise 1.3s cubic-bezier(.2,.7,.15,1) calc(2.1s + var(--i)*.14s) forwards}
.play .T{animation:fade 1s ease-out calc(3.5s + var(--i)*.055s) forwards}
@keyframes sweep{from{--a:0deg}to{--a:361deg}}
@keyframes emb{0%{opacity:1;transform:rotate(-30deg) scale(.8)}100%{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
@keyframes rise{0%{opacity:0;transform:translateY(22%);filter:blur(6px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{0%{opacity:0;transform:translateY(30%)}100%{opacity:1;transform:none}}

/* loading ring that opens the camera */
#load{margin-top:clamp(14px,3vh,28px);min-height:96px;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;text-align:center;padding:0 16px}
.play #load{animation:fadein .9s ease-out 4.8s forwards}
@keyframes fadein{to{opacity:1}}
.ring{width:46px;height:46px;animation:spin 1.15s linear infinite}
.ring circle{fill:none;stroke-width:2}
.ring .track{stroke:rgba(var(--ink-rgb),.16)}
.ring .arc{stroke:var(--ink);stroke-linecap:round;stroke-dasharray:34 92}
@keyframes spin{to{transform:rotate(360deg)}}
#loadTxt{font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;line-height:1.7;max-width:34ch}
#load.err .ring{animation:none;opacity:.35}
#loadActs{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:10px 18px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.play *{animation-duration:.01s!important;animation-delay:0s!important}.ring{animation:none!important}#panel{transition-duration:.01s!important;transition-delay:0s!important}}
</style></head>

/* ---------- logo reveal ---------- */
const st = document.getElementById('st'), intro = document.getElementById('intro');
function add(g,cls){g.forEach((d,i)=>{const im=new Image();im.src=d.src;im.alt='';im.className=cls;
  im.style.cssText='left:'+d.x+'%;top:'+d.y+'%;width:'+d.w+'%;height:'+d.h+'%;--i:'+i;st.appendChild(im)})}
add(D.emb,'emb');add(D.dot,'dot');add(D.L,'L');add(D.T,'T');
intro.classList.add('play');

/* ---------- AR ---------- */
const root = document.getElementById('ar-root'), hud = document.getElementById('hud');
const load = document.getElementById('load'), loadTxt = document.getElementById('loadTxt'), acts = document.getElementById('loadActs');
let libs = null, slowT = null, shownAt = 0;

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)})}
function loadLibs(){
  if(!libs){ libs = loadScript(AFRAME_SRC).then(()=>loadScript(MINDAR_SRC)); libs.catch(()=>{libs=null}); }
  return libs;
}
// start downloading the viewer and the card target while the logo plays
loadLibs().catch(()=>{});
try{ fetch(TARGET_SRC).catch(()=>{}); }catch(e){}

function setLoad(txt){ load.classList.remove('err'); acts.hidden = true; loadTxt.textContent = txt; }
function fail(msg){
  clearTimeout(slowT);
  root.innerHTML = '';
  load.classList.add('err');
  loadTxt.textContent = msg;
  acts.hidden = false;
}
function openHud(noCamera){
  hud.hidden = false;
  document.getElementById('panel').classList.add('show');
  if(noCamera){ document.getElementById('hintTxt').textContent = 'Camera is off. Reload to try again.'; }
  requestAnimationFrame(()=>requestAnimationFrame(()=>hud.classList.add('show')));
}
function reveal(){
  clearTimeout(slowT);
  const wait = Math.max(0, 1400 - (Date.now() - shownAt));   // let the ring be seen briefly
  setTimeout(()=>{ intro.classList.add('out'); openHud(false); }, wait);
}

// Scales the model to fit the card, centres it, and plays its built-in animation if it has one.
function registerFit(){
  if(AFRAME.components['besta-fit']) return;
  AFRAME.registerComponent('besta-fit',{
    schema:{size:{type:'number',default:0.9},lift:{type:'number',default:0.02}},
    init(){
      this.mixer = null;
      this.el.addEventListener('model-loaded', e=>{
        const T = AFRAME.THREE, obj = e.detail.model;
        obj.position.set(0,0,0); obj.scale.set(1,1,1);
        const box = new T.Box3();
        obj.traverse(m=>{
          if(!m.isMesh || !m.geometry) return;
          if(!m.geometry.boundingBox) m.geometry.computeBoundingBox();
          // matrix of this mesh relative to the model root (ignores the card and everything above it)
          const rel = new T.Matrix4();
          for(let n=m; n && n!==obj; n=n.parent){ n.updateMatrix(); rel.premultiply(n.matrix); }
          box.union(m.geometry.boundingBox.clone().applyMatrix4(rel));
        });
        if(box.isEmpty()) return;
        const size = box.getSize(new T.Vector3()), c = box.getCenter(new T.Vector3());
        const k = this.data.size / Math.max(size.x, size.y, size.z, 1e-6);
        obj.scale.setScalar(k);
        obj.position.set(-c.x*k, -c.y*k, -box.min.z*k + this.data.lift);
        const clips = obj.animations || [];
        if(clips.length){ this.mixer = new T.AnimationMixer(obj); clips.forEach(cl=>this.mixer.clipAction(cl).play()); }
      });
    },
    tick(t,dt){ if(this.mixer) this.mixer.update(dt/1000); }
  });
}

      animation__pop="property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 900; easing: easeOutBack; startEvents: pop">
      <a-entity id="sway" ${MODEL_SWAY ? 'animation="property: rotation; from: 0 -18 0; to: 0 18 0; dur: 3600; easing: easeInOutSine; dir: alternate; loop: true"' : ''}>
        <a-entity id="glb" rotation="${MODEL_ROTATION}" gltf-model="url(${MODEL_SRC})" besta-fit="size: ${MODEL_FIT}; lift: ${MODEL_LIFT}"></a-entity>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>`; }

async function startAR(){
  shownAt = Date.now();
  setLoad('Opening camera');
  clearTimeout(slowT);
  slowT = setTimeout(()=>{ loadTxt.textContent = 'Allow camera access to continue'; }, 7000);
  try{
    await loadLibs();
  }catch(e){
    fail('Could not load the AR viewer. Check your internet connection.');
    return;
  }
  registerFit();
  root.innerHTML = sceneHTML();
  const scene = root.querySelector('a-scene');
  const target = root.querySelector('#target');
  const model = root.querySelector('#model');
  root.querySelector('#glb').addEventListener('model-error', ()=>{
    document.getElementById('hintTxt').textContent = 'besta.glb was not found next to this page';
  });
  scene.addEventListener('arReady', reveal);
  scene.addEventListener('arError', ()=>fail('Camera is blocked. Allow camera access in your browser settings, then try again.'));
  target.addEventListener('targetFound', ()=>{ hud.classList.add('found'); model.emit('pop'); });
  target.addEventListener('targetLost',  ()=>{ hud.classList.remove('found'); });
}

document.getElementById('retry').addEventListener('click', startAR);
document.getElementById('skip').addEventListener('click', ()=>{ intro.classList.add('out'); openHud(true); });
setTimeout(startAR, INTRO_MS);
</script>
</body></html>
